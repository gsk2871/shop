services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: peptide
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d peptide"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
